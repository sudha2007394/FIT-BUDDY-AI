<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitBuddy AI</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif;}
  body{background:#0f0f0f;color:white;display:flex;flex-direction:column;height:100vh;}
  header{padding:20px;background:#1a1a1a;text-align:center;border-bottom:2px solid #2eff7b;}
  header h1{color:#2eff7b;}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px;}
  .msg{max-width:80%;padding:12px 16px;border-radius:15px;}
  .user{align-self:flex-end;background:#2eff7b;color:black;}
  .bot{align-self:flex-start;background:#222;border:1px solid #333;}
  #input-area{display:flex;padding:15px;background:#1a1a1a;gap:10px;}
  #input{flex:1;padding:12px;border-radius:25px;border:none;background:#2a2a2a;color:white;outline:none;}
  button{padding:12px 25px;border-radius:25px;border:none;background:#2eff7b;font-weight:bold;cursor:pointer;}
  button:hover{background:#25d665;}
</style>
</head>
<body>
<header>
  <h1>💪 FitBuddy AI is Running!</h1>
  <p style="color:#aaa;font-size:13px">Your personal fitness assistant</p>
</header>
<div id="chat">
  <div class="msg bot">Hi da! Naan thaan FitBuddy. Enna workout pannalam nu kelu da! 🔥</div>
</div>
<div id="input-area">
  <input id="input" placeholder="Ex: Enakku weight loss diet sollu da..." />
  <button onclick="send()">Send</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  
  async function send(){
    let text = input.value.trim();
    if(!text) return;
    chat.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = '';
    chat.scrollTop = chat.scrollHeight;

    // Try to call backend
    try {
      let res = await fetch('http://localhost:8001/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: text})
      });
      let data = await res.json();
      let reply = data.reply || data.message || JSON.stringify(data);
      chat.innerHTML += `<div class="msg bot">${reply}</div>`;
    } catch(e){
      chat.innerHTML += `<div class="msg bot">Backend connect aagala da. But UI work aaguthu! Route name enna nu routes.py la paakanum. Error: ${e.message}</div>`;
    }
    chat.scrollTop = chat.scrollHeight;
  }
  input.addEventListener('keypress', e => { if(e.key==='Enter') send(); });
</script>
</body>
</html>
